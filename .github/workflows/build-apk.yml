name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rapikan struktur folder
        run: |
          mkdir -p www/lib scripts assets
          [ -f index.html ] && mv index.html www/index.html || true
          [ -f copy-libs.js ] && mv copy-libs.js scripts/copy-libs.js || true
          for f in icon-only.png icon-foreground.png icon-background.png; do [ -f "$f" ] && mv "$f" assets/ || true; done
          ls -R www scripts assets
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run libs
      - run: npx cap add android
      - name: Ikon aplikasi
        continue-on-error: true
        run: npx @capacitor/assets generate --android
      - name: Izin biometrik
        run: sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build APK debug
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SahabatKampus-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          # ok
